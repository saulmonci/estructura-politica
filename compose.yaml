services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html:z'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgis/postgis:16-3.4'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:z'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
            retries: 3
            timeout: 5s
    evolution-api:
        image: 'evoapicloud/evolution-api:latest'
        restart: always
        ports:
            - '${EVOLUTION_PORT:-8080}:8080'
        environment:
            - SERVER_URL=http://localhost:8080
            - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:-orion_secret_key_123}
            - DEL_INSTANCE=false
            - DATABASE_PROVIDER=postgresql
            - DATABASE_CONNECTION_URI=postgresql://${DB_USERNAME:-root}:${DB_PASSWORD:-secret}@pgsql:5432/${DB_DATABASE:-estructura}?schema=evolution
            - DATABASE_SAVE_DATA_INSTANCE=true
            - DATABASE_SAVE_DATA_CHATS=true
            - DATABASE_SAVE_DATA_MESSAGES=true
            - CACHE_REDIS_ENABLED=false
            - CACHE_LOCAL_ENABLED=true
        volumes:
            - 'sail-evolution:/evolution/instances'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-evolution:
        driver: local


